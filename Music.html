<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: segeo UI, arial, sans-serif;
        }
        body{
            min-height: 100vh;
            background: radial-gradient(circle at top, #f752d3 0%,#0f2027 45%,black 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        /* MAIN WRAPPER */
        .album-wrapper{
            width: 1100px;
            padding: 50px;
            display: flex;
            gap: 60px;
            align-items: flex-start;
        }
        /* LEFT-ALBUM CARD */
        .album{
            width: 380px;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 26px;
            padding: 30px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 25px 70px black;
            transform: scale(0.9);
            animation: albumReveal 1.4s ease forwards;
        }
        .cover{
            width: 260px;
            height: 260px;
            margin: 0 auto 20px;
            border-radius: 20px;
            background: linear-gradient(135deg,#ff512f,#dd2476);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 3px;
        }
        .album h2{
            font-size: 30px;
            margin-bottom: 6px;
        }
        .album p{
            opacity: 0.85;
            margin-bottom: 14px;
        }
        .badge{
            display: inline-block;
            padding: 10px 28px;
            border-radius: 40px;
            background: #1db954;
            color: black;
            font-weight: bold;
            letter-spacing: 1px;
            animation: pulse 1.5s infinite;
        }
        /* RIGHT - TRACKS */
        .tracks{
            flex: 1;
        }
        .tracks h1{
            font-size: 46px;
            letter-spacing: 4px;
            margin-bottom: 6px;
        }
        .tracks span{
            font-size: 18px;
            opacity: 0.85;
        }
        /* TRACK LIST */
        .tracklist{
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        /* HIDE RADIO */
        input{
            display: none;
        }
        /* TRACK LABEL */
        .track{
            padding: 18px 24px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.4s;
            transform: translateX(40px);
            opacity: 0;
            animation: trackReveal 0.8s forwards;
        }
        .track:nth-of-type(1){
            animation-delay: 0.8s;
        }
        .track:nth-of-type(2){
            animation-delay: 1.2s;
        }
        .track:nth-of-type(3){
            animation-delay: 1.6s;
        }
        .track:nth-of-type(4){
            animation-delay: 2s;
        }
        .track:hover{
            background: #1db954;
            color: black;
            transform: translateX(10px);
        }
        /* ACTIVE TRACK */
        input:checked + label{
            background:#ffd700;
            color: black;
            font-weight: bold;
        }
        /* AUDIO PLAYER */
        audio{
            width: 100%;
            margin-top: 10px;
            display: none;
        }
        /* SHOW AUDIO FOR ACTIVE TRACK */
        input:checked + label + audio{
            display: block;
        } 
        /* ARTIST INFO */
        .artist{
            margin-top: 50px;
            padding: 30px;
            border-radius: 24px;
            background: rgba(0, 0, 0, 0.45);
            border: 2px dashed white;
        }
        .artist h3{
            font-size: 26px;
            margin-bottom: 10px;
        }
        .artist p{
            opacity: 0.85;
        }
        /* ANIMATIONS */
        @keyframes albumReveal{
            to{transform: scale(1);}
        }
        @keyframes trackReveal{
            to{
                transform: translateX(0);
                opacity: 1;
            }
        }
        @keyframes pulse{
            0%,100%{transform: scale(1);}
            50%{transform: scale(1.1);}
        }
    </style>
</head>
<body>
    <div class="album-wrapper">
        <!-- LEFT SIDE -->
         <div class="album">
            <div class="cover">NOVA</div>
            <h2>Nova Beats</h2>
            <p>Electronic/Indie Pop</p>
            <div class="badge">Now Streaming</div>
         </div>
         <!-- RIGHT SIDE -->
        <div class="tracks">
            <h1>ALBUM LAUNCH</h1>
            <span>Click a track to play</span>

            <div class="tracklist">
                <!-- TRACK 1 -->
                 <input type="radio" name="song" id="t1">
                 <label for="t1" class="track">
                    <strong>01. Midnight Echo</strong>
                    <small>1:42</small>
                 </label>
                 <audio src="../../ASSERTS/AUDIOS/Nature_Audio.mp3" controls autoplay></audio>

                 <!-- TRACK 2 -->
                  <input type="radio" name="song" id="t2">
                  <label for="t2" class="track">
                    <strong>02. Neon Skies</strong>
                    <small>1:42</small>
                  </label>
                  <audio controls autoplay>
                    <source src="../../ASSERTS/AUDIOS/Nature_Audio.mp3">
                  </audio>

                  <!-- TRACK 3 -->
                   <input type="radio" name="song" id="t3">
                   <label for="t3" class="track">
                    <strong>03. Pulse Drive</strong>
                    <small>1:42</small>
                   </label>
                   <audio src="../../ASSERTS/AUDIOS/Nature_Audio.mp3" controls autoplay></audio>

                   <!-- TRACK 4 -->
                    <input type="radio" name="song" id="t4">
                    <label for="t4" class="track">
                        <strong>04. Digital Dreams</strong>
                        <small>1:42</small>
                    </label>
                    <audio src="../../ASSERTS/AUDIOS/Nature_Audio.mp3" controls autoplay></audio>
            </div>

            <div class="artist">
                <h3>🎤 About the Artist</h3>
                <p>Nova Beats blends electronic soundscapes with modern pop, creating immersive music experiences for the next generation.</p>
            </div>
          </div>
    </div>
</body>
</html>
